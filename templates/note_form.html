{% extends "base.html" %}

{% block title %}{{ heading }} · Notas privadas{% endblock %}

{% block content %}
<section class="card form-card">
  <h1>{{ heading }}</h1>

  <form method="post" action="{{ action }}">
    <div class="field">
      <label for="title">Título</label>
      <input id="title" name="title" maxlength="200" value="{{ values.title }}" required autofocus>
    </div>

    <div class="field">
      <label for="tags">Etiquetas</label>
      <input id="tags" name="tags" maxlength="500" value="{{ values.tags }}" placeholder="trabajo, ideas, urgente">
      <p class="hint">Separa las etiquetas con comas o punto y coma.</p>
    </div>

    <div class="field">
      <label for="content">Contenido</label>
      <textarea id="content" name="content" rows="14" required>{{ values.content }}</textarea>
    </div>

    <div class="form-actions">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn btn-ghost" href="{{ url_for('note_detail', note_id=note['id']) if note else url_for('notes') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
