{% extends "base.html" %}

{% block title %}Iniciar sesión · Notas privadas{% endblock %}

{% block content %}
<div class="auth-layout">
  <section class="card auth-card">
    <h1>Iniciar sesión</h1>
    <p class="muted">Accede a tus notas privadas.</p>

    <form method="post">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" value="{{ username }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-block" type="submit">Entrar</button>
    </form>

    <p class="auth-footer">¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a></p>
  </section>
</div>
{% endblock %}
