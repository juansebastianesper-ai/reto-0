{% extends "base.html" %}

{% block title %}Registrarse · Notas privadas{% endblock %}

{% block content %}
<div class="auth-layout">
  <section class="card auth-card">
    <h1>Crear cuenta</h1>
    <p class="muted">Guarda tus ideas, tareas y recuerdos en un lugar privado.</p>

    <form method="post">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="50" value="{{ username }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <p class="hint">Mínimo 8 caracteres.</p>
      </div>
      <div class="field">
        <label for="confirm_password">Confirmar contraseña</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn btn-block" type="submit">Crear cuenta</button>
    </form>

    <p class="auth-footer">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
  </section>
</div>
{% endblock %}
